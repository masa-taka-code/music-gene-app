# 筋トレログ（workout-app）を GitHub Pages に公開する
# 本流のブランチに workout-app の変更が入ったとき、テストとビルドを通してから公開する。
# 初回だけ、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく必要がある。
name: Deploy workout-app

on:
  push:
    branches: [claude/new-session-6ppkl2]
    paths:
      - 'workout-app/**'
      - '.github/workflows/deploy-workout-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workout-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workout-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: workout-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
